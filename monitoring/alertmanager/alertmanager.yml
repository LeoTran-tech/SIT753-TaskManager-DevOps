global:
  resolve_timeout: 1m

route:
  receiver: discord-alerts
  group_by:
    - alertname
    - environment
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: discord-alerts
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook_url
        send_resolved: true
        title: '{{ .Status }} - {{ .CommonLabels.alertname }}'
        message: |
          Environment: {{ .CommonLabels.environment }}
          Severity: {{ .CommonLabels.severity }}

          {{ range .Alerts }}
          Summary: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          {{ end }}