global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: task-manager-production
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3000

  - job_name: task-manager-staging
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3001

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
